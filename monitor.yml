name: University Program & Fee Monitor

on:
  schedule:
    # Cron is in UTC (IST = UTC + 5:30).
    # 5:00 AM IST  -> 23:30 UTC the previous day
    - cron: '30 23 * * *'
    # 3:00 PM IST  -> 09:30 UTC
    - cron: '30 9 * * *'
    # 9:00 PM IST  -> 15:30 UTC
    - cron: '30 15 * * *'
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab to test

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run monitor
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python main.py
